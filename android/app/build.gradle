plugins { id 'com.android.application' }
if(System.getenv('DUSTII_BUILD_ROOT'))layout.buildDirectory.set(file(System.getenv('DUSTII_BUILD_ROOT')+'/android-app'))
def secret = rootProject.file('signing/release.json')
def signing = secret.exists() ? new groovy.json.JsonSlurper().parse(secret) : null
android {
    namespace 'cn.duskrain.dustii'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.duskrain.dustii'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }
    sourceSets { main { assets.srcDirs = [System.getenv('DUSTII_INSTALLED_CLIENT') ?: '../../artifacts/installed-client']; java.srcDirs += '../shared/src/main/java' } }
    androidResources { noCompress += ['glb','bin','webp','png','jpg','mp3','ogg','wav','hdr','f32','u8'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (signing) {
                storeFile rootProject.file('signing/dustii-release.p12')
                storePassword signing.password
                keyAlias 'dustii'
                keyPassword signing.password
            }
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
        debug { applicationIdSuffix System.getenv('DUSTII_DEBUG_SUFFIX') ?: '.debug'; versionNameSuffix '-debug' }
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
