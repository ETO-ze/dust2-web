plugins { id 'com.android.application' }
def secret = rootProject.file('signing/release.json')
def signing = secret.exists() ? new groovy.json.JsonSlurper().parse(secret) : null
android {
    namespace 'cn.duskrain.dustii'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.duskrain.dustii.offline'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    sourceSets { main.assets.srcDirs = ['../../dist-offline'] }
    androidResources { noCompress += ['glb','bin','webp','png','jpg','mp3','ogg','wav','hdr','f32','u8'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (signing) {
                storeFile rootProject.file('signing/dustii-release.p12')
                storePassword signing.password
                keyAlias 'dustii'
                keyPassword signing.password
            }
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
