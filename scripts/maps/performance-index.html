<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#161b1c"><title>高帧率地图池 · DUSKRAIN</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif;background:#171b1c;color:#e9e9e2}*{box-sizing:border-box}body{margin:0}header,main{max-width:1120px;margin:auto;padding:0 28px}header{display:flex;align-items:center;justify-content:space-between;height:64px;border-bottom:1px solid #3b4142}header strong{font:750 17px/1.1 system-ui;letter-spacing:.15em}header span{color:#b2b8b1;font-size:12px}main{padding-bottom:32px}h1{font-size:clamp(27px,4.5vw,44px);font-weight:640;letter-spacing:-.035em;line-height:1.15;margin:34px 0 6px}.summary{color:#b7bcb5;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}a{display:flex;align-items:center;gap:15px;padding:12px 16px;background:#23292a;border:1px solid #404848;color:inherit;text-decoration:none;border-radius:4px;min-height:108px;transition:border-color .15s,background .15s}a:hover,a:focus-visible{background:#2e3636;border-color:#c3d69e;outline:none}a img{width:86px;height:78px;object-fit:contain}a span{display:grid;gap:3px}a b{font-size:17px;font-weight:640}a small{font-size:12px;color:#bac4b8}a i{font:20px system-ui;color:#c3d69e;margin-left:auto}footer{max-width:1120px;padding:0 28px 24px;margin:auto;color:#99a09b;font-size:12px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}a{min-height:88px}a img{width:65px;height:65px}}@media(max-width:520px){header,main,footer{padding-left:16px;padding-right:16px}.grid{gap:7px}a{padding:8px;gap:7px;flex-wrap:wrap}a img{width:40px;height:42px}a b{font-size:14px}a i{display:none}}
</style></head><body>
<header><strong>DUSKRAIN</strong><span>战术对战平台</span></header>
<main><h1>高帧率地图池</h1><p class="summary">九张低多边形地图按需加载。进房前预载本局探员和武器皮肤的完整材质。</p>
<nav class="grid" aria-label="选择地图" id="maps"></nav><p role="status" id="status">正在读取地图目录…</p></main>
<footer>九张地图均采用 Valve 地图的场景、碰撞、导航和出生点数据，以低多边形色块呈现。</footer>
<script type="module">
const status=document.getElementById('status');
try{
 const response=await fetch('/perf/catalog.json',{cache:'no-cache'});if(!response.ok)throw Error();
 const catalog=await response.json();
 for(const map of catalog.maps){
  const link=document.createElement('a');link.href='/perf/play/'+map.id+'/';
  const img=new Image();img.src='/perf/radars/'+map.id+'.png';img.alt='';img.decoding='async';
  const label=document.createElement('span'),name=document.createElement('b'),local=document.createElement('small'),arrow=document.createElement('i');
  name.textContent=map.name;local.textContent=map.nameZh;arrow.textContent='↗';arrow.setAttribute('aria-hidden','true');label.append(name,local);link.append(img,label,arrow);document.getElementById('maps').append(link);
 }
 status.textContent=catalog.maps.length?'':'暂无可用地图';
}catch{status.textContent='无法读取地图目录，请刷新重试';}
</script></body></html>
